<tr><td>Other agents</td><td>Single-agent</td><td>Multi-agent</td><td>Multi (competitive)</td><td>Multi (drivers, people)</td><td>Multi (competitive)</td></tr>
<tr><td>Rules</td><td>Known</td><td>Unknown: must learn how the world works</td><td>Known</td><td>Mostly known</td><td>Known</td></tr></table></div>
<p>The hardest case, partially observable, stochastic, sequential, dynamic, continuous, multi-agent and unknown, is exactly the real world. That is why self-driving is so much harder than chess.</p>

<p>The agent program can be built in increasingly capable ways. Each one adds a single new ingredient to the one before it.</p>

<tr><td><b>Simple reflex</b></td><td>condition\u2013action rules on the <i>current</i> percept only</td><td>No</td><td>No</td><td>\u201CIf the doorstep is snowy, shovel.\u201D</td></tr>

<tr><td rowspan="2">A \xB7 highway</td><td>clear</td><td>0.7</td><td>+50</td></tr><tr><td>traffic jam</td><td>0.3</td><td>\u221220</td></tr>

<ol class="steps">
<li><b>Write the formula.</b> EU(a) = \u03A3 P(outcome) \xB7 U(outcome).</li>

<text x="340" y="205" text-anchor="middle" class="t-s">lavender = explored \xB7 blue = frontier \xB7 dot = start \xB7 flag = goal</text></svg>`,Nf={hook:`<p>You open a map app in Turkestan and type \u201CAstana\u201D. In less than a second it draws a route across more than a thousand kilometres of steppe. It has not tried every possible sequence of roads: there are far too many. Instead it explores <i>cleverly</i>, keeping a list of places it could go next and always choosing the most promising one. That list is called the <b>frontier</b>, and the only thing that separates BFS, DFS, uniform-cost search and A* is <i>which</i> node each one takes out of the frontier next.</p>
<p>In this chapter Qadam plans the Turkestan \u2192 Astana trip on a simplified road map. You will see why the route with the fewest cities is not the shortest, why a good guess about the remaining distance saves work, and what happens when that guess lies.</p>`,theory:`<h4>Search problems and the search tree</h4>
<p>We use the five-part problem formulation from Chapter 1. Cities are <b>states</b>, driving along a road is an <b>action</b>, Result(city, road) is the city at the other end, the goal test is \u201Ccity = Astana\u201D, and the <b>step cost</b> is the road length in km. Starting from the initial state and applying actions builds a <b>search tree</b>: each node stores a state, its parent, and <b>g(n)</b>, the total cost of the path from the start to that node.</p>
<p>Every search algorithm follows the same loop. (1) Put the start node in the <b>frontier</b>. (2) Take one node out. (3) If it is the goal, stop and return its path. (4) Otherwise <b>expand</b> it: generate its children and add them to the frontier. (5) Repeat. <b>Graph search</b> also keeps an <b>explored set</b> (closed list) so the same city is not expanded twice; on a map with loops this prevents going round in circles forever.</p>
<h4>Uninformed search: no idea where the goal is</h4>
<p><b>Breadth-first search (BFS)</b> uses a FIFO queue, so it expands all nodes one step away, then all nodes two steps away, and so on. It is <b>complete</b> (it always finds a solution if one exists, when the branching factor is finite) and finds the path with the <i>fewest steps</i>. That is the cheapest path only when every step costs the same. Its weakness is memory: it stores the whole frontier, which grows like b<sup>d</sup>.</p>
<p><b>Depth-first search (DFS)</b> uses a LIFO stack, so it follows one branch as deep as it can before backtracking. It needs very little memory (only the current path and its siblings, O(b\xB7m)), but it is not optimal, and in an infinite or cyclic space without an explored set it may never return.</p>
<p><b>Uniform-cost search (UCS)</b> uses a priority queue ordered by g(n). It always expands the cheapest unexpanded node, so the first time it <i>removes</i> the goal from the frontier, no cheaper path can exist. It is complete and optimal as long as every step cost is at least some small positive \u03B5. It is Dijkstra's algorithm stopped at a single goal.</p>
<h4>Informed search: using a heuristic</h4>
<p>A <b>heuristic</b> h(n) is an estimate of the cost from n to the nearest goal. On a road map the straight-line distance to Astana is a natural one; on a grid where you move in four directions it is the <b>Manhattan distance</b> |x\u2081 \u2212 x\u2082| + |y\u2081 \u2212 y\u2082|. <b>Greedy best-first search</b> expands the node with the lowest h(n) only. It is fast but short-sighted: it ignores how far it has already travelled. <b>A*</b> expands the node with the lowest f(n) = g(n) + h(n), the estimated cost of the <i>whole</i> trip through n.</p>
